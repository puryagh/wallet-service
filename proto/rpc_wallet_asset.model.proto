syntax = "proto3";

package proto;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/liveutil/wallet-service/internal/abstract/pb";

// WalletAsset represents a supported asset type (currency or token) in the wallet system.
// Each asset is linked to a TigerBeetle ledger for isolated double-entry bookkeeping.
// Field ordering optimized for Go memory alignment: pointers → int32 → bool → strings → maps.
message WalletAsset {
  // Timestamp when the wallet asset was created in the system
  google.protobuf.Timestamp created_at = 1; // 8 bytes (pointer)

  // Timestamp when the wallet asset was last updated (null if never updated)
  google.protobuf.Timestamp updated_at = 2; // 8 bytes (pointer)

  // Timestamp when the wallet asset was soft-deleted (null if active)
  google.protobuf.Timestamp deleted_at = 3; // 8 bytes (pointer)

  // TigerBeetle ledger code for isolating this asset's transactions
  // Each asset type should have a unique ledger for proper accounting separation
  // Stored as int32 for proto3 compatibility (SMALLINT in PostgreSQL)
  int32 ledger_code = 4; // 4 bytes

  // Indicates whether this asset is currently active and available for transactions
  // Inactive assets cannot be used for new transactions but historical data remains
  bool active = 5; // 1 byte

  // Unique external identifier for the wallet asset (ULID format)
  string identifier = 6;

  // Asset code following ISO 4217 for fiat currencies or custom codes for crypto/tokens
  // Examples: "USD", "EUR", "BTC", "ETH", "USDT"
  string code = 7;

  // Short symbol for display purposes (e.g., "$", "€", "₿")
  // Used in UI for compact representation
  string symbol = 8;

  // Human-readable name of the asset (e.g., "US Dollar", "Bitcoin", "Ethereum")
  string title = 9;

  // Optional description providing additional context about the asset
  // Can include information about decimals, network, contract address, etc.
  string description = 10;

  // Flexible key-value metadata for storing custom attributes
  // Examples: decimals, contract_address, network, icon_url, min_amount, max_amount
  map<string, string> meta_data = 11;
}

// WalletAssetResponse is an alias for WalletAsset used in API responses for clarity.
// Maintains backward compatibility with existing API contracts.
message WalletAssetResponse {
  // Timestamp when the wallet asset was created in the system
  google.protobuf.Timestamp created_at = 1;

  // Timestamp when the wallet asset was last updated (null if never updated)
  google.protobuf.Timestamp updated_at = 2;

  // Timestamp when the wallet asset was soft-deleted (null if active)
  google.protobuf.Timestamp deleted_at = 3;

  // TigerBeetle ledger code for isolating this asset's transactions
  int32 ledger_code = 4;

  // Indicates whether this asset is currently active and available for transactions
  bool active = 5;

  // Unique external identifier for the wallet asset (ULID format)
  string identifier = 6;

  // Asset code following ISO 4217 or custom codes
  string code = 7;

  // Short symbol for display purposes
  string symbol = 8;

  // Human-readable name of the asset
  string title = 9;

  // Optional description providing additional context about the asset
  string description = 10;

  // Flexible key-value metadata for storing custom attributes
  map<string, string> meta_data = 11;
}